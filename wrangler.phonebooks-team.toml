name = "phonebooks-team-staging"
main = "server/team-worker.js"
compatibility_date = "2026-11-25"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist-team"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[ratelimits]]
name = "AUTH_RATE"
namespace_id = "2111"
simple = { limit = 12, period = 60 }
