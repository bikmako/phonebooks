name: Verify PhoneBooks Accounts
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'supabase/**'
      - 'src/**'
      - 'public/sw.js'
      - 'tests/**'
      - 'tools/*accounts*'
      - 'package*.json'
      - 'vite.config.js'
      - 'wrangler.phonebooks.toml'
      - 'playwright.accounts.config.js'
      - '.github/workflows/accounts.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:accounts
      - run: npx wrangler deploy --dry-run --config wrangler.phonebooks.toml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phonebooks-account-test-results
          path: test-results
